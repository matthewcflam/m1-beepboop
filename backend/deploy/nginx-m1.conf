# nginx site config for the M1 deployment.
# Install as /etc/nginx/sites-available/m1 (symlink into sites-enabled), then
# run `sudo certbot --nginx -d <SERVER_HOST>` to add the TLS server block.
server {
    listen 80;
    server_name <SERVER_HOST>;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for the WebSocket pixel relay (Button 2).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required so GET /api/client-ip sees the real client address.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }
}
